<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TechStar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>
    Ingresar
  </h1>

  <!-- Navbar -->
  <header class="navbar">

    <div class="logo">
      <a href="index.html">
        <img src="assets/logohq-Photoroom.png" alt="Logo">
      </a>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="tecnologias.html">Tecnologías</a></li>
        <li><a href="ingresar.html">Ingresar</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

  </header>


  <!-- Login / Registro -->
  <section class="auth-section">

    <h2>Accede a TechStar</h2>

    <div class="auth-container">

      <div class="tabs">

        <button
          class="tab-btn active"
          onclick="showTab('login', this)">
          Iniciar Sesión
        </button>

        <button
          class="tab-btn"
          onclick="showTab('register', this)">
          Registrarse
        </button>

      </div>


      <!-- Login -->
      <div id="login" class="tab-content active">

        <form id="loginForm">

          <input
            type="email"
            id="loginEmail"
            placeholder="Correo electrónico"
            required
          >

          <input
            type="password"
            id="loginPassword"
            placeholder="Contraseña"
            required
          >

          <button
            type="submit"
            class="btn primary">
            Iniciar Sesión
          </button>

        </form>

      </div>


      <!-- Registro -->
      <div id="register" class="tab-content">

        <form id="registerForm">

          <input
            type="text"
            id="registerUsername"
            placeholder="Nombre de usuario"
            required
          >

          <input
            type="email"
            id="registerEmail"
            placeholder="Correo electrónico"
            required
          >

          <input
            type="password"
            id="registerPassword"
            placeholder="Contraseña"
            required
          >

          <button
            type="submit"
            class="btn primary">
            Registrarse
          </button>

        </form>

      </div>

    </div>

  </section>


  <!-- Footer -->
  <footer>

    <img
      src="assets/logo_claro.png"
      alt="Logo"
      class="footer-logo"
    >

    <h3>TechStar</h3>

    <p>Innovando el futuro del software.</p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
